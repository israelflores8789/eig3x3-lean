#:schema https://json.schemastore.org/pyproject.json

[project]
name = "eig3x3-parity"
version = "0.1.0"
description = "Parity and validation harness for the eig3x3 Lean library"
requires-python = ">=3.12"
dependencies = ["numpy", "mpmath"]

[dependency-groups]
dev = ["pytest", "ruff", "pyrefly"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["parity"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["parity"]

[tool.ruff.lint]
# E: Pycodestyle errors, F: Pyflakes, I: Isort (import organization), B: Bugbear
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "default" 
python-interpreter-path = ".venv/bin/python"
search-path = ["parity"]
project-includes = ["parity/**/*.py"]
project-excludes = [
    "**/node_modules",
    "**/.venv",
    "**/build",
    "**/dist"
]

[tool.pyrefly.errors]
unnecessary-type-conversion = "ignore"
