name = "Eig3x3"
version = "0.1.0"
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE.md"]
defaultTargets = ["Eig3x3"]
testDriver = "eig3x3_tests"
autoImplicit = false
builtinLint = true
linter.unusedVariables = true
linter.deprecated = true
linter.missingDocs = true

[[lean_lib]]
name = "Eig3x3"
srcDir = "src"
globs = ["Eig3x3.*"]

[[lean_lib]]
name = "Tests"
srcDir = "tests"
globs = ["Tests.*", "JsonMiniReader"]

[[lean_exe]]
name = "eig3x3_tests"
root = "Main"
srcDir = "tests"

[[lean_exe]]
name = "eig3x3_cli"
root = "Cli"
srcDir = "tests"

[[lean_exe]]
name = "eig3x3_bench"
root = "Bench"
srcDir = "tests"
