name: "🐛 Bug Report"
description: "Report a software defect or unexpected runtime error in Eig3x3"
title: "[Bug]: "
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Thank you for reporting a bug. Please ensure your report includes clear reproduction steps.
      If your issue relates to floating-point precision, tolerance violations, or numerical divergence, please consider using the **Numerical Discrepancy** template instead.
- type: input
  id: lean_version
  attributes:
    label: Lean Toolchain Version
    description: "Output of `lean --version` or the version specified in `lean-toolchain`"
    placeholder: "e.g., Lean (version 4.34.0-rc2, commit ...)"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Bug Description
    description: "A clear and concise description of what the bug is."
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to Reproduce / Minimal Working Example (MWE)
    description: "Provide a self-contained Lean 4 snippet or CLI input that demonstrates the issue."
    render: lean
    placeholder: |
      import Eig3x3

      def main : IO Unit := do
        let A : Eig3x3.SymmMat3 := ⟨...⟩
        let decomp := Eig3x3.eigendecomp A
        ...
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    description: "What did you expect to happen?"
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual Output / Error Message
    description: "Include full error trace or unexpected output."
    render: text
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Additional Context
    description: "Operating system, CPU architecture, compiler flags, or other environment details."
